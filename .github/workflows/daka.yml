name: 民大每日打卡

on:
  schedule:
    # UTC 11:30 = 北京时间 19:30（提前2小时，应对 cron 延迟）
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（忽略时间窗口限制）'
        type: boolean
        default: true
        required: false

jobs:
  daka:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install playwright

      - run: playwright install chromium --with-deps

      # 复用上次运行的登录 Cookie，避免每次重新登录（减少验证码触发）
      - name: 恢复登录态 Cookie
        id: cookie-cache
        uses: actions/cache@v4
        with:
          path: swun_cookies.json
          key: swun-cookies-${{ secrets.SWUN_USERNAME }}
          restore-keys: |
            swun-cookies-

      - name: 执行打卡
        env:
          SWUN_USERNAME: ${{ secrets.SWUN_USERNAME }}
          SWUN_PASSWORD: ${{ secrets.SWUN_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python daka.py --force
          else
            python daka.py
          fi

      - name: 保存截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daka-screenshots
          path: |
            daka*.png
            cas_login.png
            *.txt
            *.html
